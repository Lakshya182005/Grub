<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9AA8FF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#5B6BE0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#232941" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="miniA" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9AA8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#232941" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C8CF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7C8CF8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1000" fill="#06080D"/>

  <!-- ======== APP WINDOW ======== -->
  <rect x="40" y="40" width="1360" height="800" rx="16" fill="#0B0E14" stroke="#1C2230" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="70" cy="70" r="6" fill="#FF5F57"/>
  <circle cx="90" cy="70" r="6" fill="#FEBC2E"/>
  <circle cx="110" cy="70" r="6" fill="#28C840"/>
  <text x="720" y="75" font-size="13" fill="#8A93A6" text-anchor="middle">Hey Scribe</text>
  <line x1="40" y1="98" x2="1400" y2="98" stroke="#151A26" stroke-width="1"/>

  <!-- ======== LEFT RAIL ======== -->
  <text x="68" y="134" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7385">TODAY</text>

  <!-- active card -->
  <rect x="64" y="152" width="312" height="92" rx="10" fill="#11162A" stroke="#7C8CF8" stroke-width="1"/>
  <rect x="64" y="152" width="3" height="92" rx="1.5" fill="url(#cardGlow)"/>
  <text x="84" y="182" font-size="14.5" font-weight="600" fill="#E6E9F2">Design review moved to Thu…</text>
  <text x="84" y="205" font-size="13" fill="#8A93A6">Priya is presenting at four.</text>
  <text x="352" y="182" font-size="12" fill="#6B7385" text-anchor="end">14:32</text>

  <!-- card 2 -->
  <rect x="64" y="256" width="312" height="92" rx="10" fill="#10141F" stroke="#1C2230" stroke-width="1"/>
  <text x="84" y="286" font-size="14.5" font-weight="600" fill="#E6E9F2">Three vendor quotes by Mon…</text>
  <text x="84" y="309" font-size="13" fill="#8A93A6">Ask facilities for the shortlist.</text>
  <text x="352" y="286" font-size="12" fill="#6B7385" text-anchor="end">14:35</text>

  <!-- card 3 -->
  <rect x="64" y="360" width="312" height="92" rx="10" fill="#10141F" stroke="#1C2230" stroke-width="1"/>
  <text x="84" y="390" font-size="14.5" font-weight="600" fill="#E6E9F2">Parking pass for Berlin trip</text>
  <text x="84" y="413" font-size="13" fill="#8A93A6">Needs approval from Ops.</text>
  <text x="352" y="390" font-size="12" fill="#6B7385" text-anchor="end">14:38</text>

  <line x1="400" y1="98" x2="400" y2="840" stroke="#1C2230" stroke-width="1"/>

  <!-- ======== STAGE ======== -->
  <!-- status chip -->
  <rect x="1136" y="120" width="216" height="30" rx="15" fill="#0F1420" stroke="#1C2230" stroke-width="1"/>
  <circle cx="1156" cy="135" r="4" fill="#7DD3A0"/>
  <text x="1168" y="139" font-size="12" fill="#B8C0D0">Listening for “Hey Jarvis”</text>

  <!-- orb -->
  <circle cx="920" cy="336" r="158" fill="#7C8CF8" fill-opacity="0.035"/>
  <circle cx="920" cy="336" r="132" fill="#7C8CF8" fill-opacity="0.05"/>
  <circle cx="920" cy="336" r="108" fill="#7C8CF8" fill-opacity="0.06"/>
  <circle cx="920" cy="336" r="96" fill="none" stroke="#7C8CF8" stroke-opacity="0.20" stroke-width="1"/>
  <circle cx="920" cy="336" r="86" fill="#5B6BE0" fill-opacity="0.10"/>
  <circle cx="920" cy="336" r="76" fill="#0E1424" stroke="#3A4570" stroke-opacity="0.85" stroke-width="1"/>
  <circle cx="920" cy="336" r="70" fill="none" stroke="#9AA8FF" stroke-opacity="0.18" stroke-width="6"/>

  <!-- waveform (listening) -->
  <g fill="#DDE2FF" fill-opacity="0.92">
    <rect x="861" y="320" width="3" height="32" rx="1.5"/>
    <rect x="866" y="308" width="3" height="56" rx="1.5"/>
    <rect x="871" y="326" width="3" height="20" rx="1.5"/>
    <rect x="876" y="298" width="3" height="76" rx="1.5"/>
    <rect x="881" y="316" width="3" height="40" rx="1.5"/>
    <rect x="886" y="288" width="3" height="96" rx="1.5"/>
    <rect x="891" y="310" width="3" height="52" rx="1.5"/>
    <rect x="896" y="296" width="3" height="80" rx="1.5"/>
    <rect x="901" y="322" width="3" height="28" rx="1.5"/>
    <rect x="906" y="304" width="3" height="64" rx="1.5"/>
    <rect x="911" y="330" width="3" height="12" rx="1.5"/>
    <rect x="916" y="292" width="3" height="88" rx="1.5"/>
    <rect x="921" y="286" width="3" height="100" rx="1.5"/>
    <rect x="926" y="292" width="3" height="88" rx="1.5"/>
    <rect x="931" y="330" width="3" height="12" rx="1.5"/>
    <rect x="936" y="304" width="3" height="64" rx="1.5"/>
    <rect x="941" y="322" width="3" height="28" rx="1.5"/>
    <rect x="946" y="296" width="3" height="80" rx="1.5"/>
    <rect x="951" y="310" width="3" height="52" rx="1.5"/>
    <rect x="956" y="288" width="3" height="96" rx="1.5"/>
    <rect x="961" y="316" width="3" height="40" rx="1.5"/>
    <rect x="966" y="298" width="3" height="76" rx="1.5"/>
    <rect x="971" y="326" width="3" height="20" rx="1.5"/>
    <rect x="976" y="308" width="3" height="56" rx="1.5"/>
  </g>

  <!-- live transcript -->
  <text x="920" y="556" font-size="21" fill="#E6E9F2" text-anchor="middle">Design review moved to Thursday at four,</text>
  <text x="920" y="586" font-size="21" fill="#E6E9F2" text-anchor="middle">Priya is presenting.</text>

  <!-- spoken reply -->
  <g>
    <rect x="866" y="626" width="108" height="30" rx="15" fill="#0F1A16" stroke="#1B3228" stroke-width="1"/>
    <path d="M 882 636 l 0 10 l 5 0 l 6 5 l 0 -20 l -6 5 z" fill="#7DD3A0"/>
    <text x="902" y="646" font-size="13" fill="#7DD3A0">Noted.</text>
  </g>

  <!-- hint -->
  <text x="920" y="806" font-size="12" fill="#6B7385" text-anchor="middle">Option Space hold to talk   ·   Esc to cancel</text>

  <!-- ======== LEGEND ======== -->
  <text x="64" y="896" font-size="11" font-weight="700" letter-spacing="2" fill="#5A6274">ORB STATES</text>
  <text x="1376" y="896" font-size="11" fill="#4E5566" text-anchor="end">build target 1280 × 820  ·  window shrinks gracefully to 1040 × 700</text>

  <!-- idle -->
  <circle cx="110" cy="936" r="26" fill="#7C8CF8" fill-opacity="0.05"/>
  <circle cx="110" cy="936" r="14" fill="url(#miniA)" fill-opacity="0.55"/>
  <text x="152" y="932" font-size="13" fill="#B8C0D0">Idle</text>
  <text x="152" y="950" font-size="11.5" fill="#6B7385">breathing 4 s · chip muted</text>

  <!-- listening -->
  <circle cx="400" cy="936" r="26" fill="#7C8CF8" fill-opacity="0.07"/>
  <g fill="#DDE2FF" fill-opacity="0.9">
    <rect x="385" y="928" width="2.5" height="16" rx="1.2"/>
    <rect x="390" y="922" width="2.5" height="28" rx="1.2"/>
    <rect x="395" y="926" width="2.5" height="20" rx="1.2"/>
    <rect x="400" y="918" width="2.5" height="36" rx="1.2"/>
    <rect x="405" y="926" width="2.5" height="20" rx="1.2"/>
    <rect x="410" y="922" width="2.5" height="28" rx="1.2"/>
    <rect x="415" y="928" width="2.5" height="16" rx="1.2"/>
  </g>
  <text x="442" y="932" font-size="13" fill="#B8C0D0">Listening</text>
  <text x="442" y="950" font-size="11.5" fill="#6B7385">24 bars from RMS · 120 ms decay</text>

  <!-- thinking -->
  <circle cx="690" cy="936" r="26" fill="#7C8CF8" fill-opacity="0.05"/>
  <circle cx="690" cy="936" r="16" fill="none" stroke="#7C8CF8" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="690" cy="936" r="8" fill="url(#miniA)" fill-opacity="0.8"/>
  <text x="732" y="932" font-size="13" fill="#B8C0D0">Thinking</text>
  <text x="732" y="950" font-size="11.5" fill="#6B7385">core pulses 1.5 s · bars hidden</text>

  <!-- speaking -->
  <circle cx="980" cy="936" r="26" fill="#7DD3A0" fill-opacity="0.06"/>
  <circle cx="980" cy="936" r="17" fill="none" stroke="#7DD3A0" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="980" cy="936" r="7" fill="#7DD3A0" fill-opacity="0.75"/>
  <text x="1022" y="932" font-size="13" fill="#B8C0D0">Speaking</text>
  <text x="1022" y="950" font-size="11.5" fill="#6B7385">ring brightens · Esc stops instantly</text>

  <!-- motion note -->
  <line x1="40" y1="870" x2="1400" y2="870" stroke="#141926" stroke-width="1"/>
</svg>
